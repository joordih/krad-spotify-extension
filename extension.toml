id = "spotify"
name = "Spotify"
version = "0.1.1"
description = "Shows and controls the local Spotify player on macOS, Linux and Windows"
api = "1.1"
activation = ["startup"]

[program]
placement = "app"

# BEGIN BINARIES (release v0.1.1; generated by scripts/binaries.py)
